# Configuration for circle packing constructor evolution (n=26)
max_iterations: 100  # Increased iterations
checkpoint_interval: 10
log_level: "INFO"

max_code_length: 30000  # Increased code length for more complex programs

# LLM configuration
llm:
  #  primary_model: "o1"
  primary_model: "gpt-4.1"
  api_key: ""
  # primary_model: "llama3.1-8b"
  primary_model_weight: 0.8
  # secondary_model: "anthropic/claude-3.7-sonnet"
  # secondary_model: "llama-4-scout-17b-16e-instruct"
  secondary_model: "gpt-4.1"
  secondary_model_weight: 0.2
  # api_base: "https://openrouter.ai/api/v1"
  api_base: "https://oai-hackathon-ofa-sweden.openai.azure.com/openai/deployments/"
  # api_base: "https://api.cerebras.ai/v1"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 600

# Prompt configuration
prompt:
  system_message: |
    You are an expert mathematician specializing in optimization algorithms. Your job is to generate an advanced planning algorithm for planning / sheduling and ordering orders for a production line.
    The production line consists of multiple machines that can process orders in parallel.
    
    You can e.g. use clever sheduling algorithms, heuristics, or any other techniques that can optimize the order of processing.
    You can also try to change the sorting of the orders to reduce setup times on material changes.
  num_top_programs: 3
  use_template_stochasticity: true
  include_artifacts: true

# Database configuration
database:
  population_size: 60  # Increased population for more diversity
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 1000
  cascade_evaluation: false
  parallel_evaluations: 4
  use_llm_feedback: false
  enable_artifacts: true

# Evolution settings
diff_based_evolution: true  # Use full rewrites instead of diffs
allow_full_rewrites: false    # Allow full rewrites for constructor functions
