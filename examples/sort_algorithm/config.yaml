# Configuration for circle packing constructor evolution (n=26)
max_iterations: 100  # Increased iterations
checkpoint_interval: 10
log_level: "INFO"

# LLM configuration
llm:
  primary_model: "gpt-4.1"
  api_key: ""
  # primary_model: "llama3.1-8b"
  primary_model_weight: 0.8
  # secondary_model: "anthropic/claude-3.7-sonnet"
  # secondary_model: "llama-4-scout-17b-16e-instruct"
  secondary_model: "gpt-4.1"
  secondary_model_weight: 0.2
  # api_base: "https://openrouter.ai/api/v1"
  api_base: "https://oai-hackathon-ofa-sweden.openai.azure.com/openai/deployments/gpt-4.1"
  # api_base: "https://api.cerebras.ai/v1"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 600 

# Prompt configuration
prompt:
  system_message: |
    You are an expert mathematician specializing in sorting algorithms. Your job is to improve code that sorts a list of 10000000 entries for shortest execution time.
    
    You are not allowed to use sort functions from any libraries (not even built-in functions). You must write the sorting algorithm from scratch, using only basic Python constructs like loops and conditionals.
  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 60  # Increased population for more diversity
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: false
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false  # Use full rewrites instead of diffs
allow_full_rewrites: true    # Allow full rewrites for constructor functions
