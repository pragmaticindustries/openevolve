# Configuration for the text merging evolution task
max_iterations: 1000
checkpoint_interval: 10
log_level: "INFO"
max_code_length: 15000

# LLM configuration
llm:
  primary_model: "gpt-4.1"
  api_key: ""
  primary_model_weight: 1.0
  api_base: "https://oai-hackathon-ofa-sweden.openai.azure.com/openai/deployments/"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096
  timeout: 600

# Prompt configuration
prompt:
  system_message: |
    You are a Python expert specializing in text processing and data structures. Your task is to improve a function that merges adjacent text blocks.
    
    The basic functionality is: From an OCR step the program gets a list of single text blocks with a single line fragment of text together with a bounding box, text size and so on.
    The goal is to merge adjacent text blocks that are close together into a single block. The merging should consider the bounding boxes and text sizes to ensure that the merged block is coherent and maintains the original meaning.
    
    But only merge blocks that are close together, e.g. if the bounding boxes are overlapping or very close together. Try not to merge too many blocks, many text fragments dont need to be merged.
  num_top_programs: 3
  use_template_stochasticity: true
  include_artifacts: true

# Database configuration
database:
  population_size: 101
  archive_size: 20
  num_islands: 4
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: false
  parallel_evaluations: 4
  use_llm_feedback: false
  enable_artifacts: true

# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true